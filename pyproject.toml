[project]
name = "enterprise-agent-harness"
version = "0.1.0"
description = "Enterprise Agent Harness / Agent Runtime Platform"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "deepagents",
    "fastapi",
    "jsonschema>=4.26.0",
    "langchain",
    "langchain-openai>=1.6.4",
    "langgraph",
    "pydantic",
    "python-dotenv",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
markers = [
    "integration: integration tests requiring external services or real models",
]
