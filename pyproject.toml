[project]
name = "enterprise-agent-harness"
version = "0.1.0"
description = "Enterprise Agent Harness / Agent Runtime Platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents",
    "fastapi",
    "langchain",
    "langchain-openai>=1.6.4",
    "langgraph",
    "pydantic",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
